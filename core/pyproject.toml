[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xray-cli"
version = "0.0.1"
description = "Xray — backend protocol inspector"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Xray contributors" }]
keywords = ["cli", "http", "redis", "dns", "smtp", "grpc", "protocol", "inspector"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Networking",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "httpx[http2]>=0.27",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "redis>=5.0",
  "dnspython>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "aiosmtplib>=3.0",
  "asyncssh>=2.14",
  "aiomqtt>=1.3",
  "cryptography>=42.0",
  "websockets>=12.0",
  "asyncpg>=0.29",
  "aiomysql>=0.2",
]

[project.optional-dependencies]
sigv4 = ["botocore>=1.34"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "fakeredis>=2.21",
  "httpx>=0.27",
  "pytest-mock>=3.14",
]

[project.scripts]
xray = "xray.cli:app"
xrayd = "xray.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
